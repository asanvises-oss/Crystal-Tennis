name: watch-courts
on:
  schedule:
    # สำรอง: ถ้าบอทหยุดรันวน GitHub จะเริ่มให้ใหม่ภายในราวหนึ่งชั่วโมง
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency:
  group: watch
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            cookies.enc
          key: state-${{ github.run_id }}
          restore-keys: state-
      # รันวนราว 5 ชั่วโมง 20 นาที เช็กทุก 5 นาที
      - id: loop
        run: python3 watch.py
        env:
          LOOP_SECONDS: "19200"
          INTERVAL: "300"
          CRYSTAL_COOKIE: ${{ secrets.CRYSTAL_COOKIE }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state.json
            cookies.enc
          key: state-${{ github.run_id }}
      # เริ่มรอบถัดไปเองเสมอ (ถ้าเข้าเว็บไม่ได้ รอบจะสั้นลงเหลือ 30 นาทีเพื่ออ่านคุกกี้ใหม่)
      - if: success()
        run: gh workflow run watch.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
